<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Count</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { font-family: sans-serif; color:#111; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:#111; }
  header {
    height:160px; padding:27px 32px 0; border-bottom:1px solid #bbb;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  h1 { margin:0; font-size:54px; line-height:1; font-weight:700; letter-spacing:-1px; }
  .version { font-size:18px; color:#666; margin-top:30px; }
  nav { background:#eee; border-bottom:1px solid #bbb; height:54px; padding:0; display:flex; align-items:stretch; }
  details { width:auto; }
  details summary {
    list-style:none; cursor:pointer; height:54px; padding:14px 52px;
    font-size:24px; font-weight:700; user-select:none;
  }
  #statsBtn, #listBtn {
    height:54px; border:0; border-radius:0; background:#eee;
    padding:0 28px; font-size:24px; font-weight:700;
  }
  #statsBtn:hover, #listBtn:hover { background:#e5e5e5; }
  .stats-screen { max-width:500px; margin:10px 21px; }
  .stats-screen h2 { margin:0 0 20px; font-size:24px; }
  .stats-line { margin:0 0 12px; font-size:18px; }
  details summary::-webkit-details-marker { display:none; }
  .menu {
    position:absolute; z-index:20; left:0; top:214px; width:310px;
    background:#fff; border:1px solid #aaa; box-shadow:0 8px 18px rgba(0,0,0,.20);
    display:flex; flex-direction:column; gap:0;
  }
  .menu button {
    width:100%; height:58px; border:0; border-radius:0; background:#fff;
    text-align:left; padding:0 28px; font-size:20px;
  }
  .menu button:hover { background:#f2f2f2; }
  .menu button:disabled {
    height:1px; padding:0; background:#ccc; border:0; overflow:hidden;
    opacity:1; pointer-events:none;
  }
  main { padding:22px 21px; }
  .list { width:auto; border-collapse:collapse; table-layout:auto; }
  .list th, .list td { padding:0 8px; }
  .list thead th {
    background:#eee; border:1px solid #ccc; font-size:14px; font-weight:700;
    height:27px;
  }
  .list .radioCol { width:90px; }
  .list .dateCol { width:110px; }
  .list .timeCol { width:70px; }
  .list td { border-left:1px solid #ccc; border-right:1px solid #ccc; border-bottom:1px solid #ccc; height:27px; line-height:27px; font-size:14px; }
  .list td:first-child { text-align:center; }
  .list input[type="radio"] { width:18px; height:18px; accent-color:#777; margin:0; vertical-align:middle; }
  .empty { color:#555; padding:18px 4px; font-size:16px; }
  .screen { max-width:500px; margin:10px auto; }
  .screen h2 { margin:0 0 20px; font-size:24px; }
  label { display:block; margin:18px 0 6px; font-weight:700; font-size:16px; }
  .masked { width:100%; font-size:20px; padding:10px; letter-spacing:1px; }
  .actions { display:flex; gap:10px; margin-top:24px; }
  button { font-size:16px; padding:8px 14px; border:1px solid #777; border-radius:5px; background:#f5f5f5; color:#111; }
  .hint { color:#555; font-size:14px; margin-top:6px; }
  .error { color:#a00; font-size:14px; margin-top:8px; min-height:18px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { background:#fff; width:min(420px,100%); padding:20px; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .modal h3 { margin-top:0; font-size:18px; }
  @media (max-width:600px) {
    header { height:160px; padding-left:32px; padding-right:32px; }
    h1 { font-size:54px; }
    .list thead th { font-size:14px; }
    .list td { font-size:14px; line-height:27px; }
    .list .radioCol { width:90px; }
    .list .dateCol { width:110px; }
    .list .timeCol { width:70px; }
  }
</style>
</head>
<body>
<header>
  <h1>Count</h1>
  <div class="version">v13</div>
</header>

<nav>
  <details>
    <summary>File</summary>
    <div class="menu">
      <button id="addBtn">Add...</button>
      <button id="changeBtn">Change</button>
      <button id="deleteBtn">Delete</button>
      <button disabled>────────</button>
      <button id="importBtn">Import</button>
      <button id="exportBtn">Export</button>
      <button disabled>────────</button>
      <button id="quitBtn">Quit</button>
    </div>
  </details>
  <button id="listBtn" type="button">List</button>
  <button id="statsBtn" type="button">Stats</button>
</nav>

<main id="listScreen">
  <table class="list">
    <colgroup><col class="radioCol"><col class="dateCol"><col class="timeCol"></colgroup>
    <thead><tr><th></th><th>Date</th><th>Time</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">No records stored.</div>
</main>

<main id="statsScreen" class="stats-screen" hidden>
  <h2>Statistics</h2>
  <div class="stats-line">Count: <span id="statsCount">0</span></div>
  <div class="stats-line">Average: <span id="statsAverage">0</span></div>
  <div class="stats-line">Frequency: <span id="statsFrequency">0 (0)</span></div>
  <div class="stats-line">Frequency of Gaps: <span id="statsGapFrequency">0 (0)</span></div>
</main>

<main id="editScreen" class="screen" hidden>
  <h2 id="editTitle">Add</h2>
  <label for="dateInput">Date</label>
  <input id="dateInput" class="masked" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="__/__/____" aria-label="Date">
  <div class="hint">MM/DD/YYYY</div>

  <label for="timeInput">Time</label>
  <input id="timeInput" class="masked" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="__:__" aria-label="Time">
  <div class="hint">24-hour time, HH:MM</div>

  <div id="editError" class="error"></div>
  <div class="actions">
    <button id="saveBtn">Save</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</main>

<div id="deleteModal" class="modal-backdrop">
  <div class="modal">
    <h3>Are you sure?</h3>
    <div class="actions">
      <button id="confirmDelete">Yes</button>
      <button id="cancelDelete">Cancel</button>
    </div>
  </div>
</div>

<div id="importModal" class="modal-backdrop">
  <div class="modal">
    <h3>Import CSV</h3>
    <input id="fileInput" type="file" accept=".csv,text/csv">
    <div class="hint">Choose a CSV file containing Date,Time values.</div>
    <div id="importError" class="error"></div>
    <div class="actions">
      <button id="confirmImport">Import</button>
      <button id="cancelImport">Cancel</button>
    </div>
  </div>
</div>

<div id="quitModal" class="modal-backdrop">
  <div class="modal">
    <h3>Quit</h3>
    <p>The supporting page must be manually closed.</p>
    <div class="actions"><button id="closeQuit">OK</button></div>
  </div>
</div>

<script>
const STORAGE_KEY = "count.records.v1";
let records = loadRecords();
let selectedId = null;
let editingId = null;

function loadRecords() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}
function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function sortRecords() {
  records.sort((a,b) => {
    const [am,ad,ay] = a.date.split("/").map(Number);
    const [bm,bd,by] = b.date.split("/").map(Number);
    const [ah,ai] = a.time.split(":").map(Number);
    const [bh,bi] = b.time.split(":").map(Number);
    return (by-ay) || (bm-am) || (bd-ad) || (bh-ah) || (bi-ai);
  });
}
function todayDate() {
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getDate()).padStart(2,"0") + "/" + d.getFullYear();
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" +
         String(d.getMinutes()).padStart(2,"0");
}
function digitsToDate(v) {
  const d = v.replace(/\D/g,"").slice(0,8);
  let out = d.slice(0,2);
  if (d.length > 2) out += "/" + d.slice(2,4);
  if (d.length > 4) out += "/" + d.slice(4,8);
  return out;
}
function digitsToTime(v) {
  const d = v.replace(/\D/g,"").slice(0,4);
  let out = d.slice(0,2);
  if (d.length > 2) out += ":" + d.slice(2,4);
  return out;
}
function validDate(v) {
  v=v.replace(/_/g,"");
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return false;
  const month=+m[1], day=+m[2], year=+m[3];
  const dt = new Date(year,month-1,day);
  return month>=1 && month<=12 && day>=1 && dt.getFullYear()===year && dt.getMonth()===month-1 && dt.getDate()===day;
}
function validTime(v) {
  v=v.replace(/_/g,"");
  const m=v.match(/^(\d{2}):(\d{2})$/);
  return !!m && +m[1] <= 23 && +m[2] <= 59;
}
function dateKey(v) {
  const [m,d,y]=v.split("/");
  return y + m + d;
}
function renderList() {
  sortRecords();
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  document.getElementById("empty").style.display=records.length ? "none":"block";

  // Color only dates that occur at least twice.
  // Every singleton date remains the normal white background.
  const dateCounts = new Map();
  for (const r of records) dateCounts.set(r.date, (dateCounts.get(r.date) || 0) + 1);

  const dateColors = ["#dceaff","#e3f3e3","#fff0c7","#eee1ff","#ffe1e1","#ddf2ef"];
  const colorByDate = new Map();
  let colorIndex = 0;

  for (const r of records) {
    const tr=document.createElement("tr");
    if (dateCounts.get(r.date) >= 2) {
      if (!colorByDate.has(r.date)) {
        colorByDate.set(r.date, dateColors[colorIndex % dateColors.length]);
        colorIndex++;
      }
      tr.style.backgroundColor = colorByDate.get(r.date);
    }

    const radio=document.createElement("input");
    radio.type="radio"; radio.name="selected"; radio.checked=(r.id===selectedId);
    radio.addEventListener("change",()=>selectedId=r.id);

    const td0=document.createElement("td"); td0.appendChild(radio);
    const td1=document.createElement("td"); td1.textContent=r.date;
    const td2=document.createElement("td"); td2.textContent=r.time;
    tr.append(td0,td1,td2); tbody.appendChild(tr);
  }
}
function showList() {
  document.getElementById("editScreen").hidden=true;
  document.getElementById("statsScreen").hidden=true;
  document.getElementById("listScreen").hidden=false;
  renderList();
}
function showStats() {
  closeFileMenu();
  document.getElementById("listScreen").hidden=true;
  document.getElementById("editScreen").hidden=true;
  document.getElementById("statsScreen").hidden=false;

  document.getElementById("statsCount").textContent=records.length;
  const counts=new Map();
  for(const r of records) counts.set(r.date,(counts.get(r.date)||0)+1);
  const average=counts.size ? records.length / counts.size : 0;
  document.getElementById("statsAverage").textContent=average.toFixed(2);

  // Frequency distribution: for each unique date, count its rows.
  // Then tally how many unique dates have each row-count value.
  const frequency=new Map();
  for (const count of counts.values()) frequency.set(count,(frequency.get(count)||0)+1);
  const frequencyText=[...frequency.entries()]
    .sort((a,b)=>a[0]-b[0])
    .map(([value,count])=>`${value} (${count})`)
    .join("     ");
  document.getElementById("statsFrequency").textContent=frequencyText || "0 (0)";

  // Frequency of Gaps: for each pair of consecutive unique dates,
  // count the missing calendar days between them.
  const uniqueDates=[...counts.keys()].sort((a,b)=>{
    const [am,ad,ay]=a.split("/").map(Number);
    const [bm,bd,by]=b.split("/").map(Number);
    return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
  });
  const gapFrequency=new Map();
  for(let i=1;i<uniqueDates.length;i++){
    const [pm,pd,py]=uniqueDates[i-1].split("/").map(Number);
    const [cm,cd,cy]=uniqueDates[i].split("/").map(Number);
    const previous=new Date(py,pm-1,pd);
    const current=new Date(cy,cm-1,cd);
    const days=Math.round((current-previous)/86400000);
    const gap=days-1;
    if(gap>0) gapFrequency.set(gap,(gapFrequency.get(gap)||0)+1);
  }
  const gapText=[...gapFrequency.entries()]
    .sort((a,b)=>a[0]-b[0])
    .map(([value,count])=>`${value} (${count})`)
    .join("     ");
  document.getElementById("statsGapFrequency").textContent=gapText || "0 (0)";
}
function showEdit(mode,id=null) {
  document.getElementById("listScreen").hidden=true;
  document.getElementById("editScreen").hidden=false;
  document.getElementById("editTitle").textContent=mode;
  editingId=id;
  document.getElementById("editError").textContent="";
  if (mode==="Add") {
    initializeMask(dateEl,"date",todayDate());
    initializeMask(timeEl,"time",nowTime());
  } else {
    const r=records.find(x=>x.id===id);
    initializeMask(dateEl,"date",r?.date || "");
    initializeMask(timeEl,"time",r?.time || "");
  }
  document.getElementById("dateInput").focus();
}
function selectedRecord() { return records.find(r=>r.id===selectedId); }

const MASKS = {
  date: ["_","_","/","_","_","/","_","_","_","_"],
  time: ["_","_",":","_","_"]
};

function maskDigits(value, kind) {
  const maxDigits = kind === "date" ? 8 : 4;
  const digits = String(value).replace(/\D/g,"").slice(0,maxDigits);
  const mask = MASKS[kind].slice();
  let di=0;
  for (let i=0;i<mask.length && di<digits.length;i++) {
    if (mask[i]==="_") mask[i]=digits[di++];
  }
  return mask.join("");
}

function digitPositions(kind) {
  const p=[];
  MASKS[kind].forEach((c,i)=>{ if(c==="_") p.push(i); });
  return p;
}

function nextDigitPosition(pos, kind) {
  const p=digitPositions(kind);
  return p.find(x=>x>=pos) ?? MASKS[kind].length;
}
function previousDigitPosition(pos, kind) {
  const p=digitPositions(kind);
  for(let i=p.length-1;i>=0;i--) if(p[i]<pos) return p[i];
  return -1;
}

function initializeMask(el, kind, value) {
  el.value = maskDigits(value, kind);
  const p=nextDigitPosition(0,kind);
  el.setSelectionRange(p,p);
}

function maskedBeforeInput(e, kind) {
  const el=e.target;
  const start=el.selectionStart ?? 0;
  const end=el.selectionEnd ?? start;
  const positions=digitPositions(kind);
  const chars=el.value.split("");

  // Work with the existing fixed mask, not with a normal editable string.
  e.preventDefault();

  if (e.inputType === "insertText" || e.inputType === "insertCompositionText") {
    const text=(e.data || "").replace(/\D/g,"");
    let pos=start;

    for (const ch of text) {
      pos=nextDigitPosition(pos,kind);
      if (pos>=chars.length) break;
      chars[pos]=ch;
      pos++;
      // Automatically skip the separator.
      if (pos<chars.length && MASKS[kind][pos] !== "_") pos++;
    }
    el.value=chars.join("");
    el.setSelectionRange(Math.min(pos,chars.length),Math.min(pos,chars.length));
    return;
  }

  if (e.inputType === "deleteContentBackward") {
    let p = previousDigitPosition(start,kind);
    if (start !== end) {
      for (const x of positions) if(x>=start && x<end) chars[x]="_";
      el.value=chars.join("");
      el.setSelectionRange(start,start);
    } else if (p>=0) {
      chars[p]="_";
      el.value=chars.join("");
      el.setSelectionRange(p,p);
    }
    return;
  }

  if (e.inputType === "deleteContentForward") {
    let p = nextDigitPosition(start,kind);
    if (p<chars.length) {
      chars[p]="_";
      el.value=chars.join("");
      el.setSelectionRange(p,p);
    }
    return;
  }

  if (e.inputType === "insertFromPaste") {
    const text=(e.data || "").replace(/\D/g,"");
    let pos=start;
    for(const ch of text) {
      pos=nextDigitPosition(pos,kind);
      if(pos>=chars.length) break;
      chars[pos]=ch; pos++;
      if(pos<chars.length && MASKS[kind][pos]!=="_") pos++;
    }
    el.value=chars.join("");
    el.setSelectionRange(Math.min(pos,chars.length),Math.min(pos,chars.length));
  }
}

function maskedKeydown(e, kind) {
  // Some Android keyboard/browser combinations don't expose beforeinput
  // for Backspace/Delete, so handle those keys too.
  if (e.key!=="Backspace" && e.key!=="Delete") return;
  e.preventDefault();
  const el=e.target;
  const start=el.selectionStart ?? 0;
  const end=el.selectionEnd ?? start;
  const chars=el.value.split("");
  const positions=digitPositions(kind);

  if(start!==end) {
    for(const p of positions) if(p>=start && p<end) chars[p]="_";
    el.value=chars.join("");
    el.setSelectionRange(start,start);
    return;
  }

  if(e.key==="Backspace") {
    const p=previousDigitPosition(start,kind);
    if(p>=0) {
      chars[p]="_";
      el.value=chars.join("");
      el.setSelectionRange(p,p);
    }
  } else {
    const p=nextDigitPosition(start,kind);
    if(p<chars.length) {
      chars[p]="_";
      el.value=chars.join("");
      el.setSelectionRange(p,p);
    }
  }
}

function maskedPaste(e, kind) {
  e.preventDefault();
  const text=(e.clipboardData || window.clipboardData).getData("text").replace(/\D/g,"");
  const el=e.target, chars=el.value.split("");
  let pos=el.selectionStart ?? 0;
  for(const ch of text) {
    pos=nextDigitPosition(pos,kind);
    if(pos>=chars.length) break;
    chars[pos]=ch; pos++;
    if(pos<chars.length && MASKS[kind][pos]!=="_") pos++;
  }
  el.value=chars.join("");
  el.setSelectionRange(Math.min(pos,chars.length),Math.min(pos,chars.length));
}

function maskedBlur(el, kind) {
  // Keep the separators visible even when no digits have been entered.
  const current=el.value.replace(/\D/g,"");
  el.value=maskDigits(current,kind);
}

const dateEl=document.getElementById("dateInput");
const timeEl=document.getElementById("timeInput");

dateEl.addEventListener("beforeinput", e=>maskedBeforeInput(e,"date"));
timeEl.addEventListener("beforeinput", e=>maskedBeforeInput(e,"time"));
dateEl.addEventListener("keydown", e=>maskedKeydown(e,"date"));
timeEl.addEventListener("keydown", e=>maskedKeydown(e,"time"));
dateEl.addEventListener("paste", e=>maskedPaste(e,"date"));
timeEl.addEventListener("paste", e=>maskedPaste(e,"time"));
dateEl.addEventListener("blur", ()=>maskedBlur(dateEl,"date"));
timeEl.addEventListener("blur", ()=>maskedBlur(timeEl,"time"));

function closeFileMenu(){ const d=document.querySelector("details"); if(d) d.removeAttribute("open"); }
document.getElementById("listBtn").onclick=showList;
document.getElementById("statsBtn").onclick=showStats;
document.getElementById("addBtn").onclick=()=>{closeFileMenu();showEdit("Add");};
document.getElementById("changeBtn").onclick=()=>{
  closeFileMenu();
  if (!selectedRecord()) return alert("Please select a record.");
  showEdit("Change",selectedId);
};
document.getElementById("deleteBtn").onclick=()=>{
  closeFileMenu();
  if (!selectedRecord()) return alert("Please select a record.");
  document.getElementById("deleteModal").style.display="flex";
};
document.getElementById("cancelDelete").onclick=()=>document.getElementById("deleteModal").style.display="none";
document.getElementById("confirmDelete").onclick=()=>{
  records=records.filter(r=>r.id!==selectedId);
  selectedId=null; saveRecords();
  document.getElementById("deleteModal").style.display="none"; showList();
};

document.getElementById("saveBtn").onclick=()=>{
  const date=document.getElementById("dateInput").value.replace(/_/g,"");
  const time=document.getElementById("timeInput").value.replace(/_/g,"");
  const err=document.getElementById("editError");
  if (!validDate(date)) { err.textContent="Enter a valid date as MM/DD/YYYY."; return; }
  if (!validTime(time)) { err.textContent="Enter a valid 24-hour time as HH:MM."; return; }
  if (editingId===null) {
    const r={id:crypto.randomUUID(),date,time};
    records.push(r); selectedId=r.id;
  } else {
    const r=records.find(x=>x.id===editingId);
    if(r){r.date=date;r.time=time;} selectedId=editingId;
  }
  saveRecords(); showList();
};

document.getElementById("cancelBtn").onclick=()=>{ editingId=null; showList(); };

document.getElementById("exportBtn").onclick=()=>{
  closeFileMenu();
  sortRecords();
  const csv="Date,Time\n"+records.map(r=>`${r.date},${r.time}`).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="Count.csv"; a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick=()=>{
  closeFileMenu();
  document.getElementById("fileInput").value="";
  document.getElementById("importError").textContent="";
  document.getElementById("importModal").style.display="flex";
};
document.getElementById("cancelImport").onclick=()=>document.getElementById("importModal").style.display="none";
document.getElementById("confirmImport").onclick=()=>{
  const file=document.getElementById("fileInput").files[0];
  const err=document.getElementById("importError");
  if(!file){err.textContent="Please choose a CSV file.";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const text = reader.result.replace(/^\uFEFF/, "");
    const lines=text.replace(/\r/g,"").split("\n").filter(x=>x.trim()!=="");
      const start=/^\s*date\s*,\s*time\s*$/i.test(lines[0]) ? 1 : 0;
      const imported=[];
      for(let i=start;i<lines.length;i++){
        const parts=lines[i].split(",");
        if(parts.length<2 || !validDate(parts[0].trim()) || !validTime(parts[1].trim()))
          throw new Error("Invalid Date or Time on CSV line "+(i+1)+".");
        imported.push({id:crypto.randomUUID(),date:parts[0].trim(),time:parts[1].trim()});
      }
      records=imported; selectedId=records[0]?.id || null; saveRecords();
      document.getElementById("importModal").style.display="none"; showList();
    } catch(e){err.textContent=e.message || "Import failed."; }
  };
  reader.readAsText(file);
};

document.getElementById("quitBtn").onclick=()=>{closeFileMenu();document.getElementById("quitModal").style.display="flex";};
