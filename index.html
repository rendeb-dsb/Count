<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Count</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { font-family: Arial, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #111; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid #bbb; }
  h1 { margin:0; font-size:24px; font-weight:700; }
  .version { font-size:18px; }
  nav { border-bottom:1px solid #bbb; padding:8px 10px; }
  details summary { cursor:pointer; font-weight:700; padding:5px; }
  .menu { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  button { font-size:16px; padding:8px 14px; border:1px solid #777; border-radius:5px; background:#f5f5f5; color:#111; }
  button:disabled { opacity:.5; }
  main { padding:12px; }
  .list { width:100%; border-collapse:collapse; }
  .list th, .list td { border-bottom:1px solid #ccc; padding:8px 5px; text-align:left; }
  .list th:first-child, .list td:first-child { width:42px; text-align:center; }
  .list input[type="text"] { width:100%; border:0; background:transparent; font:inherit; padding:4px; }
  .list input[type="text"]:focus { outline:1px solid #777; background:#fafafa; }
  .screen { max-width:420px; margin:10px auto; }
  .screen h2 { margin-top:0; }
  label { display:block; margin:18px 0 6px; font-weight:700; }
  .masked { width:100%; font-size:22px; padding:10px; letter-spacing:1px; }
  .actions { display:flex; gap:10px; margin-top:24px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:20px; }
  .modal { background:#fff; width:min(420px,100%); padding:20px; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .modal h3 { margin-top:0; }
  .modal .actions { margin-top:18px; }
  .hint { color:#555; font-size:13px; margin-top:6px; }
  .empty { color:#555; padding:18px 4px; }
  .error { color:#a00; font-size:14px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<header>
  <h1>Count</h1>
  <div class="version">v1</div>
</header>

<nav>
  <details>
    <summary>File</summary>
    <div class="menu">
      <button id="addBtn">Add...</button>
      <button id="changeBtn">Change</button>
      <button id="deleteBtn">Delete</button>
      <button disabled>────────</button>
      <button id="importBtn">Import</button>
      <button id="exportBtn">Export</button>
      <button disabled>────────</button>
      <button id="quitBtn">Quit</button>
    </div>
  </details>
</nav>

<main id="listScreen">
  <table class="list">
    <thead><tr><th></th><th>Date</th><th>Time</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">No records stored.</div>
</main>

<main id="editScreen" class="screen" hidden>
  <h2 id="editTitle">Add</h2>
  <label for="dateInput">Date</label>
  <input id="dateInput" class="masked" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="__/__/____" aria-label="Date">
  <div class="hint">MM/DD/YYYY</div>

  <label for="timeInput">Time</label>
  <input id="timeInput" class="masked" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="__:__" aria-label="Time">
  <div class="hint">24-hour time, HH:MM</div>

  <div id="editError" class="error"></div>
  <div class="actions">
    <button id="saveBtn">Save</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</main>

<div id="deleteModal" class="modal-backdrop">
  <div class="modal">
    <h3>Are you sure?</h3>
    <div class="actions">
      <button id="confirmDelete">Yes</button>
      <button id="cancelDelete">Cancel</button>
    </div>
  </div>
</div>

<div id="importModal" class="modal-backdrop">
  <div class="modal">
    <h3>Import CSV</h3>
    <input id="fileInput" type="file" accept=".csv,text/csv">
    <div class="hint">Choose a CSV file containing Date,Time values.</div>
    <div id="importError" class="error"></div>
    <div class="actions">
      <button id="confirmImport">Import</button>
      <button id="cancelImport">Cancel</button>
    </div>
  </div>
</div>

<div id="quitModal" class="modal-backdrop">
  <div class="modal">
    <h3>Quit</h3>
    <p>The supporting page must be manually closed.</p>
    <div class="actions"><button id="closeQuit">OK</button></div>
  </div>
</div>

<script>
const STORAGE_KEY = "count.records.v1";
let records = loadRecords();
let selectedId = null;
let editingId = null;

function loadRecords() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}
function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function sortRecords() {
  records.sort((a,b) => {
    const ka = a.date + "T" + a.time, kb = b.date + "T" + b.time;
    return kb.localeCompare(ka);
  });
}
function todayDate() {
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getDate()).padStart(2,"0") + "/" + d.getFullYear();
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" +
         String(d.getMinutes()).padStart(2,"0");
}
function digitsToDate(v) {
  const d = v.replace(/\D/g,"").slice(0,8);
  let out = d.slice(0,2);
  if (d.length > 2) out += "/" + d.slice(2,4);
  if (d.length > 4) out += "/" + d.slice(4,8);
  return out;
}
function digitsToTime(v) {
  const d = v.replace(/\D/g,"").slice(0,4);
  let out = d.slice(0,2);
  if (d.length > 2) out += ":" + d.slice(2,4);
  return out;
}
function validDate(v) {
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return false;
  const month=+m[1], day=+m[2], year=+m[3];
  const dt = new Date(year,month-1,day);
  return month>=1 && month<=12 && day>=1 && dt.getFullYear()===year && dt.getMonth()===month-1 && dt.getDate()===day;
}
function validTime(v) {
  const m=v.match(/^(\d{2}):(\d{2})$/);
  return !!m && +m[1] <= 23 && +m[2] <= 59;
}
function dateKey(v) {
  const [m,d,y]=v.split("/");
  return y + m + d;
}
function renderList() {
  sortRecords();
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  document.getElementById("empty").style.display=records.length ? "none":"block";
  for (const r of records) {
    const tr=document.createElement("tr");
    const radio=document.createElement("input");
    radio.type="radio"; radio.name="selected"; radio.checked=(r.id===selectedId);
    radio.addEventListener("change",()=>selectedId=r.id);
    const td0=document.createElement("td"); td0.appendChild(radio);
    const td1=document.createElement("td"); td1.textContent=r.date;
    const td2=document.createElement("td"); td2.textContent=r.time;
    tr.append(td0,td1,td2); tbody.appendChild(tr);
  }
}
function showList() {
  document.getElementById("editScreen").hidden=true;
  document.getElementById("listScreen").hidden=false;
  renderList();
}
function showEdit(mode,id=null) {
  document.getElementById("listScreen").hidden=true;
  document.getElementById("editScreen").hidden=false;
  document.getElementById("editTitle").textContent=mode;
  editingId=id;
  document.getElementById("editError").textContent="";
  if (mode==="Add") {
    document.getElementById("dateInput").value=todayDate();
    document.getElementById("timeInput").value=nowTime();
  } else {
    const r=records.find(x=>x.id===id);
    document.getElementById("dateInput").value=r?.date || "";
    document.getElementById("timeInput").value=r?.time || "";
  }
  document.getElementById("dateInput").focus();
}
function selectedRecord() { return records.find(r=>r.id===selectedId); }

document.getElementById("dateInput").addEventListener("input", e => e.target.value=digitsToDate(e.target.value));
document.getElementById("timeInput").addEventListener("input", e => e.target.value=digitsToTime(e.target.value));

document.getElementById("addBtn").onclick=()=>showEdit("Add");
document.getElementById("changeBtn").onclick=()=>{
  if (!selectedRecord()) return alert("Please select a record.");
  showEdit("Change",selectedId);
};
document.getElementById("deleteBtn").onclick=()=>{
  if (!selectedRecord()) return alert("Please select a record.");
  document.getElementById("deleteModal").style.display="flex";
};
document.getElementById("cancelDelete").onclick=()=>document.getElementById("deleteModal").style.display="none";
document.getElementById("confirmDelete").onclick=()=>{
  records=records.filter(r=>r.id!==selectedId);
  selectedId=null; saveRecords();
  document.getElementById("deleteModal").style.display="none"; showList();
};

document.getElementById("saveBtn").onclick=()=>{
  const date=document.getElementById("dateInput").value;
  const time=document.getElementById("timeInput").value;
  const err=document.getElementById("editError");
  if (!validDate(date)) { err.textContent="Enter a valid date as MM/DD/YYYY."; return; }
  if (!validTime(time)) { err.textContent="Enter a valid 24-hour time as HH:MM."; return; }
  if (editingId===null) {
    const r={id:crypto.randomUUID(),date,time};
    records.push(r); selectedId=r.id;
  } else {
    const r=records.find(x=>x.id===editingId);
    if(r){r.date=date;r.time=time;} selectedId=editingId;
  }
  saveRecords(); showList();
};

document.getElementById("cancelBtn").onclick=()=>{ editingId=null; showList(); };

document.getElementById("exportBtn").onclick=()=>{
  sortRecords();
  const csv="Date,Time\\n"+records.map(r=>`${r.date},${r.time}`).join("\\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="Count.csv"; a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick=()=>{
  document.getElementById("fileInput").value="";
  document.getElementById("importError").textContent="";
  document.getElementById("importModal").style.display="flex";
};
document.getElementById("cancelImport").onclick=()=>document.getElementById("importModal").style.display="none";
document.getElementById("confirmImport").onclick=()=>{
  const file=document.getElementById("fileInput").files[0];
  const err=document.getElementById("importError");
  if(!file){err.textContent="Please choose a CSV file.";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const lines=reader.result.replace(/\r/g,"").split("\n").filter(x=>x.trim()!=="");
      const start=/^\s*date\s*,\s*time\s*$/i.test(lines[0]) ? 1 : 0;
      const imported=[];
      for(let i=start;i<lines.length;i++){
        const parts=lines[i].split(",");
        if(parts.length<2 || !validDate(parts[0].trim()) || !validTime(parts[1].trim()))
          throw new Error("Invalid Date or Time on CSV line "+(i+1)+".");
        imported.push({id:crypto.randomUUID(),date:parts[0].trim(),time:parts[1].trim()});
      }
      records=imported; selectedId=records[0]?.id || null; saveRecords();
      document.getElementById("importModal").style.display="none"; showList();
    } catch(e){err.textContent=e.message || "Import failed."; }
  };
  reader.readAsText(file);
};

document.getElementById("quitBtn").onclick=()=>document.getElementById("quitModal").style.display="flex";
document.getElementById("closeQuit").onclick=()=>document.getElementById("quitModal").style.display="none";

renderList();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
